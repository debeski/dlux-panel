{% load crispy_forms_tags %}

<div class="p-2">
    {% if description %}<p class="text-muted small">{{ description }}</p>{% endif %}
    <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="dlux-modal-form-actions d-flex justify-content-end gap-2" data-dlux-modal-footer>
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">{{ DLUX_STRINGS.fleet_cancel|default:'Cancel' }}</button>
            <button type="submit" class="{{ submit_class }} rounded-pill">{{ submit_label }}</button>
        </div>
    </form>
</div>
