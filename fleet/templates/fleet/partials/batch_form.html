{% load crispy_forms_tags %}

<div class="modal-header border-0 pb-0">
    <h5 class="modal-title fw-bold"><i class="bi bi-layers me-2"></i> Batch update</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body p-4">
    <p class="text-muted small">Concurrency defaults to one and is capped at three. Unstarted members stop after the first failure unless continue-on-failure is selected.</p>
    <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="dlux-modal-form-actions d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-pill">Queue batch</button>
        </div>
    </form>
</div>
