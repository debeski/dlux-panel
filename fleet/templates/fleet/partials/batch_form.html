{% load crispy_forms_tags %}

<div class="p-2">
    <p class="text-muted small">{{ DLUX_STRINGS.fleet_batch_hint|default:'Concurrency defaults to one and is capped at three. Unstarted members stop after the first failure unless continue-on-failure is selected.' }}</p>
    <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="dlux-modal-form-actions d-flex justify-content-end gap-2" data-dlux-modal-footer>
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">{{ DLUX_STRINGS.fleet_cancel|default:'Cancel' }}</button>
            <button type="submit" class="btn btn-primary rounded-pill">{{ DLUX_STRINGS.fleet_batch_queue|default:'Queue batch' }}</button>
        </div>
    </form>
</div>
